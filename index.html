<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; form-action 'none'; base-uri 'self'">
  <meta name="referrer" content="no-referrer">
  <title>Month Ahead</title>
  <meta name="description" content="A private weekly money check-in for building a cash buffer. Your data stays on your phone.">
  <meta name="theme-color" content="#f2f5f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1412" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Month Ahead">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="view" tabindex="-1"><p class="muted">Loading your numbers…</p></main>
  <nav class="tabs" aria-label="Main">
    <ul>
      <li><a href="#home" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a></li>
      <li><a href="#checkin" data-tab="checkin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg><span>Check-in</span></a></li>
      <li><a href="#bills" data-tab="bills"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg><span>Bills</span></a></li>
      <li><a href="#growth" data-tab="growth"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18"/><path d="M5 16l5-5 4 3 6-7"/><path d="M15 7h5v5"/></svg><span>Growth</span></a></li>
    </ul>
  </nav>
  <dialog id="dialog"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <canvas id="confetti" hidden aria-hidden="true"></canvas>
  <noscript>Month Ahead needs JavaScript turned on.</noscript>
</body>
</html>
